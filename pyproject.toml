[project]
name = "relational-fraud-detection"
version = "0.1.0"
description = "Temporal transaction graph construction and leakage-aware fraud detection baselines on IEEE-CIS"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "torch>=2.4",
    "torch-geometric>=2.6",
    "xgboost>=2.1",
    "kaggle>=1.6",
    "matplotlib>=3.8",
    "pyarrow>=14",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "ipykernel>=6", "nbformat>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
